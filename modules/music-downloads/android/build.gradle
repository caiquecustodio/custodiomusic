plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.musicdownloads'
version = '1.0.0'
repositories { maven { url 'https://jitpack.io' } }
android {
  namespace 'expo.modules.musicdownloads'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
    buildConfigField 'String', 'JAMENDO_CLIENT_ID', '"' + (System.getenv('JAMENDO_CLIENT_ID') ?: '').replaceAll('[^a-zA-Z0-9]', '') + '"'
  }
  buildFeatures { buildConfig true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }
}
dependencies {
  // SDK 58 uses prebuilt Expo AARs unless buildFromSource is configured.
  if (findProject(':expo-audio') != null) {
    implementation project(':expo-audio')
  } else {
    def audioVersion = new groovy.json.JsonSlurper().parse(file('../../../node_modules/expo-audio/package.json')).version
    implementation "expo.modules.audio:expo.modules.audio:$audioVersion"
  }
  implementation 'androidx.media3:media3-exoplayer:1.9.1'
  implementation 'androidx.media3:media3-datasource-okhttp:1.9.1'
  implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.room:room-runtime:2.7.2'
  annotationProcessor 'androidx.room:room-compiler:2.7.2'
  implementation 'androidx.core:core-ktx:1.16.0'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
